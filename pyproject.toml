[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metricguard-ai"
version = "0.1.0"
description = "Conflict-aware RAG system for analytics metric governance"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "PyYAML",
    "langchain-text-splitters>=1.1.2,<2.0.0",
    "sqlglot",
    "networkx",
    "pydantic>=2,<3",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]